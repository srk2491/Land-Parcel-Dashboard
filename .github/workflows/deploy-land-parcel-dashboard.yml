name: Deploy Land Parcel Dashboard to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy-land-parcel-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy public assets to Cloudflare Pages
        run: npx wrangler@4 pages deploy public --project-name=land-parcel-dashboard --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}